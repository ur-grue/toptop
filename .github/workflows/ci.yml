name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features

      - name: Release build
        run: cargo build --release

      - name: Hot-path regression guard
        run: cargo bench

  macos:
    # The README advertises macOS as verified; this is what keeps that true.
    # The Linux-specific paths (/proc, /sys, nvidia-smi) degrade to empty
    # panels there, which the tests assert rather than skip.
    name: macos · build + test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Tests
        run: cargo test --all-features
      - name: Release build
        run: cargo build --release

  msrv:
    # rust-version in Cargo.toml and the README both promise 1.85. Without a
    # job pinned to it, the promise drifts silently — as it already had: the
    # advertised 1.82 stopped being true when ratatui 0.30 pulled in a
    # dependency requiring edition2024 (Rust 1.85+). This job is what caught it.
    name: msrv 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: msrv-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: msrv-cargo-
      - name: Build with the advertised MSRV
        run: cargo build --all-targets

  audit:
    # The dependency tree is tiny, so this costs seconds and catches an
    # advisory against ratatui/crossterm/sysinfo the day it lands.
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit
        run: cargo audit
