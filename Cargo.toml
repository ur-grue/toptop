[package]
name = "toptop"
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
description = "A gorgeous, feature-rich terminal system monitor — an htop/btop alternative with high-resolution braille graphs, truecolor gradient meters, an interactive process table, and switchable themes."
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/ur-grue/toptop"
keywords = ["system-monitor", "tui", "htop", "btop", "process"]
categories = ["command-line-utilities"]

[[bin]]
name = "toptop"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
sysinfo = "0.38"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
